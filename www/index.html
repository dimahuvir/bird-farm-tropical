<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Птичья ферма</title>
<style>
:root{--night:#0A2620;--canopy:#17413A;--moss:#2E6B4F;--egg:#F6E7C1;--amber:#F2A33A;--berry:#C2437B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--night);color:var(--egg);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--canopy)}
#level{min-width:92px}
#level b{display:block;font-size:14px;color:var(--amber)}
#level small{font-size:10.5px;opacity:.85}
#xp{height:6px;border-radius:3px;background:var(--night);margin-top:3px;overflow:hidden}
#xpfill{height:100%;width:0%;background:var(--amber)}
.stat{flex:1;text-align:center;font-size:13px;font-weight:700;background:var(--night);border-radius:12px;padding:7px 2px;white-space:nowrap;overflow:hidden}
.pulse{animation:pulse .35s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22);box-shadow:0 0 14px var(--amber)}100%{transform:scale(1)}}
#stage{position:relative;flex:1;min-height:0;background:var(--night)}
#stage canvas{display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,24,12,.5) 100%)}
#names{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));pointer-events:none}
.cell{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 3px 6px}
.lk{display:none;position:absolute;left:4%;right:4%;top:5%;bottom:52px;border-radius:16px;background:rgba(8,30,24,.66);align-items:flex-start;justify-content:center;padding-top:30%;font-size:13px;font-weight:700;text-align:center;line-height:1.35;pointer-events:none}
.cell.locked .lk,.cell.empty .lk{display:flex}
.pill{position:relative;pointer-events:auto;width:96%;font-family:inherit;color:var(--egg);font-size:11.5px;font-weight:700;line-height:1.15;padding:6px 6px 7px;border-radius:13px;border:2px solid var(--amber);
  background:linear-gradient(#1f5242,#0f3027);box-shadow:0 3px 0 #06201a,0 5px 10px rgba(0,0,0,.5)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #06201a}
.pill span{display:block}
.bar{display:block;width:80%;height:6px;margin:5px auto 0;border-radius:3px;background:#06201a;overflow:hidden}
.bar b{display:block;height:100%;width:0%;background:linear-gradient(90deg,#C2437B,#F27BA5)}
.cell.locked .bar,.cell.empty .bar{display:none}
.fl{position:absolute;z-index:4;pointer-events:none;font-weight:800;font-size:18px;white-space:nowrap;transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.7)}
@keyframes fl{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
#nav{display:flex;gap:6px;padding:9px 10px;background:var(--canopy)}
#nav button{flex:1;padding:11px 2px;font-size:13.5px;font-weight:700;font-family:inherit;border:0;border-radius:13px;background:var(--moss);color:var(--egg)}
#nav button.on{background:var(--amber);color:var(--night)}
#nav button:active{transform:scale(.97)}
#nav{gap:4px;padding:9px 6px}#nav button{font-size:12.5px;padding:11px 1px}
#sell{display:none;position:absolute;right:10px;bottom:10px;z-index:5;font-family:inherit;font-weight:800;font-size:13px;color:#1b1204;background:linear-gradient(#ffc766,#f2a33a);border:0;border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 #9a6414,0 6px 12px rgba(0,0,0,.45)}
#sell:active{transform:translateY(2px)}
#help{position:absolute;top:8px;left:8px;z-index:5;font-size:17px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(246,231,193,.35);background:rgba(10,38,32,.75);color:var(--egg)}
#goal{display:none;position:absolute;top:8px;left:54px;right:54px;z-index:5;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25;padding:7px 8px;border-radius:12px;background:rgba(10,38,32,.85);border:1px solid rgba(242,163,58,.7);color:#F6E7C1}
#snd{position:absolute;top:8px;right:8px;z-index:5;font-size:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(246,231,193,.35);background:rgba(10,38,32,.75);color:var(--egg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{font-family:inherit;font-weight:700;font-size:12px;color:var(--egg);background:#17413A;border:1px solid rgba(246,231,193,.25);border-radius:999px;padding:7px 11px}
.chip.on{background:var(--amber);color:#1b1204;border-color:var(--amber)}
.up{color:#7bd88f}.dn{color:#ff8a8a}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;white-space:pre-line;background:var(--berry);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.35;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#modal{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:50;padding:20px}
#modal .box{width:100%;max-width:320px;background:linear-gradient(#1f5242,#0f3027);border:2px solid var(--amber);border-radius:20px;padding:20px 16px 16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#mtitle{font-size:18px;font-weight:800;color:var(--amber);line-height:1.3;white-space:pre-line}
#mbody{font-size:14px;line-height:1.5;margin-top:10px;white-space:pre-line}
#mok{margin-top:16px;font-family:inherit;font-weight:800;font-size:16px;color:#1b1204;background:linear-gradient(#ffc766,#f2a33a);border:0;border-radius:14px;padding:11px 40px;box-shadow:0 3px 0 #9a6414}
#mok:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6414}
#panel{display:none;position:absolute;inset:0;overflow-y:auto;background:rgba(8,30,24,.97);z-index:6;padding:12px 12px 20px}
#panel h2{margin:4px 0 10px;font-size:18px;color:var(--amber)}
#panel h3{margin:16px 0 8px;font-size:13px;color:#9fd8a8;text-transform:uppercase;letter-spacing:.04em}
.cd{display:flex;align-items:center;gap:10px;background:linear-gradient(#17413A,#10312a);border:1px solid rgba(246,231,193,.18);border-radius:14px;padding:10px;margin-bottom:8px}
.cd.dim{opacity:.55}
.cd.on{border-color:var(--amber)}
.ic{font-size:26px;width:34px;text-align:center;flex:none}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:14px}
.tx small{display:block;font-size:11.5px;opacity:.82;margin-top:2px;line-height:1.3}
.rt{flex:none;text-align:right;font-size:12px;font-weight:700}
.b{font-family:inherit;font-weight:800;font-size:12.5px;color:#1b1204;background:linear-gradient(#ffc766,#f2a33a);border:0;border-radius:11px;padding:9px 10px;box-shadow:0 3px 0 #9a6414;white-space:nowrap;margin-left:4px}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6414}
.b.off{background:#3a4a44;color:#8aa095;box-shadow:0 3px 0 #22302b}
.b.alt{background:linear-gradient(#9fe9f0,#4cc3d0);box-shadow:0 3px 0 #2a8590}
.pb{height:7px;border-radius:4px;background:#06201a;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#F2A33A,#ffd98a)}
.note{font-size:11.5px;opacity:.75;line-height:1.4;margin:6px 2px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="level"><b id="lvl">Уровень 1</b><small id="emo"></small><div id="xp"><div id="xpfill"></div></div></div>
    <div class="stat" id="eggs">🥚 0</div>
    <div class="stat" id="coins">🪙 0</div>
    <div class="stat" id="gems">💎 0</div>
  </div>
  <div id="stage"><div id="vig"></div><div id="names"></div><button id="sell"></button><button id="snd">🔊</button><button id="help">❓</button><div id="goal"></div><div id="panel"></div></div>
  <div id="nav">
    <button class="on" data-t="farm">Ферма</button>
    <button data-t="birds">Птицы</button>
    <button data-t="market">Рынок</button>
    <button data-t="shop">Магазин</button>
    <button data-t="friends">Друзья</button>
  </div>
</div>
<div id="toast"></div>
<div id="modal"><div class="box"><div id="mtitle"></div><div id="mbody"></div><button id="mok">ОК</button></div></div>
<script src="lib/three.min.js"></script>
<script src="birds.js"></script>
<script src="jungle.js"></script>
<script>
(function(){
var T=THREE;
var modal=document.getElementById('modal'),mtitle=document.getElementById('mtitle'),mbody=document.getElementById('mbody'),mq=[],mopen=false;
function showModal(){
 var t=mq.shift();
 if(!t){mopen=false;modal.style.display='none';return;}
 mopen=true;var parts=t.split('\n');mtitle.textContent=parts[0];mbody.textContent=parts.slice(1).join('\n');mbody.style.display=parts.length>1?'block':'none';modal.style.display='flex';if(typeof lastSfx!=='undefined'&&performance.now()-lastSfx>250)play('modal');}
function say(t){if(mq.indexOf(t)>=0||mq.length>20)return;mq.push(t);if(!mopen)showModal();}
document.getElementById('mok').addEventListener('click',showModal);
function R(a,b){return a+Math.random()*(b-a);}
function fmt(n){n=Math.round(n);if(n>=1e9)return (n/1e9).toFixed(1)+' млрд';if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1)+' млн';if(n>=1e4)return (n/1e3).toFixed(n>=1e5?0:1)+' тыс';return ''+n;}

/* ---------- сцена ---------- */
var stage=document.getElementById('stage'),W=stage.clientWidth,H=stage.clientHeight;
var scene=new T.Scene();scene.background=new T.Color(0x3f8f50);
var fov=35,tanH=Math.tan(fov/2*Math.PI/180),aspect=W/H,dist=20/(tanH*aspect);
scene.fog=new T.Fog(0x5aa56a,dist*1.1,dist*2.6);
var cam=new T.PerspectiveCamera(fov,aspect,0.1,500);cam.position.set(0,0,dist);cam.lookAt(0,0,0);
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W,H);
stage.insertBefore(renderer.domElement,stage.firstChild);
scene.add(new T.HemisphereLight(0xdff5dc,0x2a4a30,0.9));
var key=new T.DirectionalLight(0xfff0cc,1.15);key.position.set(8,12,12);scene.add(key);
var rim=new T.DirectionalLight(0x88e0ff,0.4);rim.position.set(-8,4,-6);scene.add(rim);
var visH=2*dist*tanH,visW=visH*aspect,cellW=visW/3,cellH=visH/2,hw=visW/2,hh=visH/2;
var EGGZ=6,ke=(dist-EGGZ)/dist; /* яйца спереди всех листьев; ke компенсирует перспективу */
var jungle=buildJungle(scene,visW,visH);

function bamboo(x,y,len,vert){
 var g=new T.Group(),mat=new T.MeshStandardMaterial({color:0xe0c06a,roughness:0.55}),nm=new T.MeshStandardMaterial({color:0x8a6a2a,roughness:0.6}),s,ring;
 g.add(new T.Mesh(new T.CylinderGeometry(0.34,0.34,len,12),mat));
 for(s=-len/2+2.2;s<len/2;s+=2.6){ring=new T.Mesh(new T.TorusGeometry(0.37,0.08,6,14),nm);ring.rotation.x=Math.PI/2;ring.position.y=s;g.add(ring);}
 g.position.set(x,y,-1);if(!vert)g.rotation.z=Math.PI/2;scene.add(g);}
bamboo(-cellW/2,0,visH,true);bamboo(cellW/2,0,visH,true);bamboo(0,0,visW,false);
[-cellW/2,cellW/2].forEach(function(x){var kn=new T.Mesh(new T.TorusGeometry(0.55,0.12,8,16),new T.MeshStandardMaterial({color:0x4a3a1c,roughness:0.8}));kn.position.set(x,0,-0.6);scene.add(kn);
 jungle.cluster(x,0,-0.4,Math.PI/2+0.3,2,cellW*0.22,0.9);});

/* ---------- частицы ---------- */
var glowT=(function(){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.4,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new T.CanvasTexture(c);})();
var PN=300,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pNext=0,pGeo=new T.BufferGeometry(),pk;
for(pk=0;pk<PN;pk++)pPos[pk*3+2]=-999;
pGeo.setAttribute('position',new T.BufferAttribute(pPos,3));pGeo.setAttribute('color',new T.BufferAttribute(pCol,3));
var pts=new T.Points(pGeo,new T.PointsMaterial({size:visH*0.045,map:glowT,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));pts.frustumCulled=false;scene.add(pts);
var tmpC=new T.Color();
function spark(x,y,z,vx,vy,vz,hex,life){var k=pNext++%PN;tmpC.setHex(hex);pPos[k*3]=x;pPos[k*3+1]=y;pPos[k*3+2]=z;pVel[k*3]=vx;pVel[k*3+1]=vy;pVel[k*3+2]=vz;pCol[k*3]=tmpC.r;pCol[k*3+1]=tmpC.g;pCol[k*3+2]=tmpC.b;pLife[k]=life;}
function burst(x,y,z,n,hex,spd,up){for(var k=0;k<n;k++){var a=R(0,6.28),s=spd*R(0.4,1);spark(x,y,z,Math.cos(a)*s,Math.sin(a)*s+(up||0),R(-0.5,0.5),hex,R(0.6,1.1));}}
function updParticles(dt){
 for(var k=0;k<PN;k++){if(pLife[k]<=0)continue;pLife[k]-=dt;
  if(pLife[k]<=0){pPos[k*3+2]=-999;continue;}
  pPos[k*3]+=pVel[k*3]*dt;pPos[k*3+1]+=pVel[k*3+1]*dt;pPos[k*3+2]+=pVel[k*3+2]*dt;pVel[k*3+1]-=cellW*0.8*dt;
  var f=Math.min(1,pLife[k]*2.2);pCol[k*3]*=1-dt*0.8*(1-f);pCol[k*3+1]*=1-dt*0.8*(1-f);pCol[k*3+2]*=1-dt*0.8*(1-f);}
 pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;}

/* ---------- декор (покупается в магазине) ---------- */
var dec={},decFly=[],decBulb=[],fallTex=null;
(function(){
 var k,a;
 var g1=new T.Group();
 [-cellW/2,cellW/2].forEach(function(x){for(k=0;k<10;k++){a=k/10*6.283;var f=new T.Mesh(new T.SphereGeometry(0.28,8,6),new T.MeshStandardMaterial({color:[0xff6fa5,0xffd24d,0xffffff,0xff8a3c][k%4],roughness:0.5}));f.position.set(x+Math.cos(a)*1.5,Math.sin(a)*1.5,-0.2);g1.add(f);}});
 scene.add(g1);dec.wreath=g1;
 var g2=new T.Group();
 [-0.3,0.05,0.35].forEach(function(fx,i){var xx=visW*fx,len=visH*(0.05+i*0.012);
  var st2=new T.Mesh(new T.CylinderGeometry(0.04,0.04,len,5),new T.MeshBasicMaterial({color:0x5a3a1a}));st2.position.set(xx,hh-len/2,0.8);g2.add(st2);
  var lam=new T.Mesh(new T.SphereGeometry(0.55,12,10),new T.MeshBasicMaterial({color:0xffd27a}));lam.position.set(xx,hh-len-0.4,0.8);g2.add(lam);
  var gl=new T.Sprite(new T.SpriteMaterial({map:glowT,color:0xffc860,transparent:true,opacity:0.8,blending:T.AdditiveBlending,depthWrite:false}));gl.scale.set(4,4,1);gl.position.copy(lam.position);g2.add(gl);});
 scene.add(g2);dec.lamps=g2;
 var g3=new T.Group();
 for(k=0;k<14;k++){var s=new T.Sprite(new T.SpriteMaterial({map:glowT,color:0xeaff80,transparent:true,opacity:0.9,blending:T.AdditiveBlending,depthWrite:false}));s.scale.set(1.1,1.1,1);g3.add(s);decFly.push({s:s,a:R(0,6),b:R(0,6),sx:R(0.2,0.6),sy:R(0.2,0.5)});}
 scene.add(g3);dec.flies=g3;
 var g4=new T.Group();
 [0xff4d4d,0xffa64d,0xffe14d,0x6fdc5a,0x4da6ff,0x9a6bff].forEach(function(c,i){g4.add(new T.Mesh(new T.TorusGeometry(visW*(0.6-i*0.03),0.5,8,60,Math.PI),new T.MeshBasicMaterial({color:c,transparent:true,opacity:0.5,fog:false})));});
 g4.position.set(0,-hh*0.15,-6);scene.add(g4);dec.rainbow=g4;
 /* гирлянда */
 var g5=new T.Group(),gp=[];
 for(k=0;k<=8;k++)gp.push(new T.Vector3(-hw+k*visW/8,hh*0.95-Math.sin(k/8*Math.PI)*hh*0.04,1.2));
 g5.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(gp),40,0.06,5,false),new T.MeshBasicMaterial({color:0x3a2a1a})));
 for(k=0;k<16;k++){var c3=new T.CatmullRomCurve3(gp).getPoint(k/15),bc=[0xff6b6b,0xffd93d,0x6bcB77,0x4d96ff][k%4];
  var bl=new T.Mesh(new T.SphereGeometry(0.32,8,6),new T.MeshBasicMaterial({color:bc}));bl.position.copy(c3);bl.position.y-=0.35;g5.add(bl);
  var gs=new T.Sprite(new T.SpriteMaterial({map:glowT,color:bc,transparent:true,opacity:0.8,blending:T.AdditiveBlending,depthWrite:false}));gs.scale.set(2.2,2.2,1);gs.position.copy(bl.position);g5.add(gs);decBulb.push(gs);}
 scene.add(g5);dec.garland=g5;
 /* кристаллы */
 var g6=new T.Group();
 [[-0.9,-0.93],[-0.8,-0.95],[0.82,-0.94],[0.92,-0.92],[0.02,-0.97]].forEach(function(p,i){var cr=new T.Mesh(new T.ConeGeometry(0.7+i%2*0.3,3+i%3,6),new T.MeshStandardMaterial({color:0x7fe5e5,emissive:0x2a9aa0,roughness:0.2,transparent:true,opacity:0.88}));
  cr.position.set(visW*p[0]/2*2*0.5*2/2,hh*p[1],1.4);cr.position.x=hw*p[0];cr.rotation.z=(i-2)*0.15;g6.add(cr);
  var gs=new T.Sprite(new T.SpriteMaterial({map:glowT,color:0x7fe5e5,transparent:true,opacity:0.6,blending:T.AdditiveBlending,depthWrite:false}));gs.scale.set(5,5,1);gs.position.copy(cr.position);g6.add(gs);});
 scene.add(g6);dec.crystals=g6;
 /* водопад */
 var fc=document.createElement('canvas');fc.width=64;fc.height=256;var fg=fc.getContext('2d'),i2;fg.fillStyle='rgba(120,200,255,0.55)';fg.fillRect(0,0,64,256);
 for(i2=0;i2<40;i2++){fg.fillStyle='rgba(255,255,255,'+R(0.2,0.7)+')';fg.fillRect(R(0,60),R(0,256),R(2,5),R(20,60));}
 fallTex=new T.CanvasTexture(fc);fallTex.wrapS=fallTex.wrapT=T.RepeatWrapping;
 var wf=new T.Mesh(new T.PlaneGeometry(3.4,visH*1.05),new T.MeshBasicMaterial({map:fallTex,transparent:true,opacity:0.75}));wf.position.set(-hw*0.99,0,-2.5);
 dec.waterfall=wf;scene.add(wf);
})();

/* ---------- эмоции птиц (одна новая за уровень, 15 штук) ---------- */
var E=[
{id:'love',icon:'💖',name:'Любовь'},{id:'joy',icon:'😄',name:'Радость'},{id:'curious',icon:'🤔',name:'Любопытство'},
{id:'surprise',icon:'😮',name:'Удивление'},{id:'sleepy',icon:'😴',name:'Сонливость'},{id:'playful',icon:'🤩',name:'Игривость'},
{id:'proud',icon:'😎',name:'Гордость'},{id:'laugh',icon:'😂',name:'Смех'},{id:'inlove',icon:'🥰',name:'Влюблённость'},{id:'ecstatic',icon:'🎉',name:'Восторг'},
{id:'dance',icon:'💃',name:'Танец'},{id:'sing',icon:'🎵',name:'Пение'},{id:'shy',icon:'😳',name:'Смущение'},{id:'sneaky',icon:'😏',name:'Хитрость'},{id:'grateful',icon:'🙏',name:'Благодарность'}];
var RANKS=[[1,'Новичок'],[5,'Птичник'],[10,'Фермер'],[15,'Знаток джунглей'],[20,'Хранитель яиц'],[30,'Повелитель птиц'],[40,'Легенда джунглей'],[50,'Хозяин тропиков']];
function rankName(L){var r='';RANKS.forEach(function(x){if(L>=x[0])r=x[1];});return r;}

var eggTex=(function(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d'),i;g.fillStyle='#fff7e6';g.fillRect(0,0,128,128);

var AC=null,master,sfxGain,musicGain,musicBus,noiseW,noiseB,lastSfx=0,musicOn=false,sfxLast={};
function impulse(dur,decay){var n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(2,n,AC.sampleRate),c,i,d;for(c=0;c<2;c++){d=b.getChannelData(c);for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}

function audioInit(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 var Cx=window.AudioContext||window.webkitAudioContext;if(!Cx)return;
 AC=new Cx();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
 sfxGain=AC.createGain();sfxGain.connect(master);
 musicGain=AC.createGain();musicGain.connect(master);
 musicBus=AC.createGain();musicBus.connect(musicGain);
 var rv=AC.createConvolver();rv.buffer=impulse(2.6,2.4);var rg=AC.createGain();rg.gain.value=0.45;musicBus.connect(rv);rv.connect(rg);rg.connect(musicGain);
 var n1=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d1=n1.getChannelData(0),last=0,i;
 for(i=0;i<d1.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d1[i]=last*3.5;}noiseB=n1;
 var n2=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d2=n2.getChannelData(0);for(i=0;i<d2.length;i++)d2[i]=Math.random()*2-1;noiseW=n2;
 applyAudio();startMusic();}
function tone(f,dur,type,vol,f2,when,dest,pan){
 if(!AC)return;var t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain(),out=dest||sfxGain;
 o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
 g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(0.015,dur/3));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g);
 if(pan!==undefined&&AC.createStereoPanner){var p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(out);}else g.connect(out);
 o.start(t0);o.stop(t0+dur+0.05);}
function noise(dur,ftype,freq,vol,when,dest){
 if(!AC)return;var t0=AC.currentTime+(when||0),sr=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 sr.buffer=noiseW;f.type=ftype;f.frequency.value=freq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 sr.connect(f);f.connect(g);g.connect(dest||sfxGain);sr.start(t0);sr.stop(t0+dur+0.05);}
function chirp(kind,pan,vol,dest){
 var base=R(2400,4300),t=0,i,n,f,up;
 if(kind==='trill'){n=Math.round(R(8,14));for(i=0;i<n;i++){tone(i%2?base*1.12:base,0.045,'sine',vol,0,t,dest,pan);t+=0.05;}}
 else if(kind==='coo'){f=R(380,470);for(i=0;i<3;i++){tone(f,0.5,'sine',vol*1.6,f*0.9,t,dest,pan);t+=0.45;}}
 else{n=Math.round(R(2,4));for(i=0;i<n;i++){up=Math.random()<0.5;tone(up?base*0.8:base*1.2,0.09,'sine',vol,up?base*1.25:base*0.85,t,dest,pan);t+=0.12;}}}

function pad(f,t0,dur){
 var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
 o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.004;lp.type='lowpass';lp.frequency.value=1100;
 g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.04,t0+2.8);g.gain.setValueAtTime(0.04,t0+dur-3);g.gain.linearRampToValueAtTime(0.0001,t0+dur);
 o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(musicBus);o.start(t0);o2.start(t0);o.stop(t0+dur+0.1);o2.stop(t0+dur+0.1);}

for(var sl=0;sl<6;sl++){names.insertAdjacentHTML('beforeend','<div class="cell" data-s="'+sl+'"><div class="lk"></div><button class="pill" data-s="'+sl+'"><span></span><i class="bar"><b></b></i></button></div>');}
var bars=[].slice.call(document.querySelectorAll('#names .bar b')),cells=[].slice.call(document.querySelectorAll('.cell')),pills=[].slice.call(document.querySelectorAll('.pill'));
for(var s0=0;s0<6;s0++){(function(s){
 var col=s%3,row=Math.floor(s/3),cx=(col-1)*cellW,cy=(row===0?1:-1)*visH/4;
 var eg=makeEgg(cellW*0.11*ke);eg.root.position.set(cx*ke,(cy+cellH*0.28)*ke,EGGZ);scene.add(eg.root);
 objs.push({A:null,idx:-1,eg:eg,cx:cx,cy:cy,by:0,bt:0,blink:0,emo:null,lay:null,cheer:null,wasReady:false});})(s0);}
function getModel(idx){
 if(!models[idx]){var A=makeBird(idx);A.B.visible=false;A.B.rotation.y=-0.5;scene.add(A.B);models[idx]=A;}
 return models[idx];}
function assignSlot(s,idx){
 var o=objs[s];if(o.A)o.A.B.visible=false;
 st.slots[s]=idx;o.A=null;o.idx=idx;
 if(idx>=0){var A=getModel(idx),sc=Math.min(cellW*0.86,cellH*0.42)/A.ext;o.A=A;A.B.scale.setScalar(sc);
  o.by=o.cy-A.cy*sc-cellH*0.08;A.B.position.set(o.cx-A.cx*sc,o.by,0);A.B.visible=true;
  if(A.accId!==st.acc){setAccessory(A,st.acc);A.accId=st.acc;}}
 o.lay=null;o.cheer=null;o.emo=null;o.wasReady=false;}
function putBird(s,idx){
 var prev=st.slots[s],s2=idx>=0?st.slots.indexOf(idx):-1;
 if(s2>=0&&s2!==s){objs[s].A=null;assignSlot(s2,prev);}
 assignSlot(s,idx);}
for(var s1=0;s1<6;s1++)assignSlot(s1,st.slots[s1]);
function updSlots(){
 cells.forEach(function(c,s){
  var lk=c.querySelector('.lk'),pl=pills[s],idx=st.slots[s],locked=s>=st.nsl,empty=!locked&&idx<0;
  c.classList.toggle('locked',locked);c.classList.toggle('empty',empty);
  if(locked){lk.innerHTML='🔒<br>Слот '+(s+1)+'<br>'+(st.level<SL[s].lvl?'уровень '+SL[s].lvl:'🪙'+fmt(SL[s].price)+'<br>нажми, чтобы открыть');pl.firstChild.textContent='🔒 Слот '+(s+1);pl.style.borderColor='#6b7a72';}
  else if(empty){lk.innerHTML='＋<br>Пустой слот';pl.firstChild.textContent='Выбрать птицу';pl.style.borderColor='#F2A33A';}
  else{pl.firstChild.textContent=BN[idx];pl.style.borderColor=TYPES[BD[idx].type].col;}
  objs[s].eg.root.visible=!locked&&idx>=0;});}
function updDecor(){for(var id in dec)dec[id].visible=!!st.decor[id];}
updDecor();
names.addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;var s=+b.dataset.s;
 if(s>=st.nsl){
  if(s>st.nsl){play('err');say('Сначала открой слот '+(st.nsl+1),2000);return;}
  if(st.level<SL[s].lvl){play('err');say('Слот '+(s+1)+': откроется на уровне '+SL[s].lvl,2000);return;}
  if(st.coins<SL[s].price){play('err');say('Слот '+(s+1)+': нужно 🪙'+fmt(SL[s].price),2000);return;}
  st.coins-=SL[s].price;st.nsl=s+1;
  for(var k=0;k<NB;k++)if(st.own[k]&&st.slots.indexOf(k)<0){assignSlot(s,k);break;}
  play('buy');say('Слот '+(s+1)+' открыт!',2000);burst(objs[s].cx*ke,objs[s].cy*ke,EGGZ,30,0xF2A33A,cellW,cellW*0.4);hud();save();return;}
 pickSlot=s;openPanel('pick');});

/* ---------- действия ---------- */
function floatText(txt,x,y,color,size){
 var d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';
 if(color)d.style.color=color;if(size)d.style.fontSize=size+'px';stage.appendChild(d);setTimeout(function(){d.remove();},1100);}
function eggPos(o){var e=o.eg;return {x:e.root.position.x,y:e.root.position.y+e.egg.position.y,z:e.root.position.z};}
var ray=new T.Raycaster(),ndc=new T.Vector2(),cv=renderer.domElement;
function toScreen(p){var v=new T.Vector3(p.x,p.y,p.z).project(cam),rc=cv.getBoundingClientRect();return {x:(v.x*0.5+0.5)*rc.width,y:(-v.y*0.5+0.5)*rc.height};}
var combo=0,lastCollect=0,lastPet=0;
function collect(s,px,py,auto,mul,tag){
 var o=objs[s],idx=st.slots[s];if(idx<0||s>=st.nsl)return;var b=st.birds[idx];if(!b.ready)return;
 if(total()>=cap()){if(!auto){say('📦 Амбар полон! Продай яйца на рынке или расширь амбар',2200);pulse(document.getElementById('eggs'));}return;}
 var now=performance.now(),gap=now-lastCollect;
 if(!auto){combo=(gap<1500)?Math.min(combo+1,6):1;lastCollect=now;}
 var Ty=TYPES[BD[idx].type],extra=auto?Math.max(0,(mul||1)-1):0.1*(combo-1),n=1+Math.floor(extra)+(Math.random()<extra%1?1:0),p=eggPos(o);
 n=Math.max(1,Math.min(n,cap()-total()));
 st.inv[idx]+=n;st.cnt[idx]+=n;st.eggs+=n;addXp(Ty.xp*n);b.mood=Math.min(1,b.mood+0.05);
 checkDay();st.q.p.eggs+=n;if(BD[idx].type>0)st.q.p.rare+=n;
 burst(p.x,p.y,p.z,18+BD[idx].type*8,Ty.hex,cellW*1.2,cellW*0.4);burst(p.x,p.y,p.z,10,0xF2A33A,cellW*0.9,cellW*1.1);
 o.cheer={t:0,dur:1.2};play('egg',auto?0.9:1+0.06*(combo-1));
 floatText((tag||'')+'+'+n+' 🥚'+(!auto&&combo>1?'  x'+combo:''),px,py,BD[idx].type>0?'#F2A33A':'#F6E7C1',20);
 if(BD[idx].type===3&&Math.random()<0.15){st.gems+=1;floatText('💎 +1',px,py-26,'#9fe9f0',20);}
 b.ready=false;b.prog=0;b.reserved=false;hud();
 pulse(document.getElementById('eggs'));}
function emote(s,px,py){
 var o=objs[s],n=Math.min(st.level,E.length),pool=[],k;
 for(k=0;k<n;k++)if(n===1||k!==o.lastE)pool.push(k);
 var ei=pool[Math.floor(Math.random()*pool.length)];o.lastE=ei;play('chirp');
 o.emo={id:E[ei].id,t:0,dur:E[ei].id==='sleepy'?2.2:1.6};
 floatText(E[ei].icon+' '+E[ei].name,px,py,'#F6E7C1',17);
 if(E[ei].id==='inlove'){floatText('💗',px-30,py+10,'#fff',22);floatText('💗',px+30,py+5,'#fff',22);}
 if(E[ei].id==='ecstatic'){floatText('✨',px-34,py,'#fff',22);floatText('✨',px+34,py-8,'#fff',22);}}
function pet(s,px,py){
 var now=performance.now();if(now-lastPet<250)return;lastPet=now;
 var idx=st.slots[s];if(idx<0||s>=st.nsl)return;
 checkDay();st.q.p.pets++;st.tut.pet=true;st.birds[idx].mood=Math.min(1,st.birds[idx].mood+0.1);emote(s,px,py);}
function tap(cx,cy){
 play('tap');var rc=cv.getBoundingClientRect(),px=cx-rc.left,py=cy-rc.top;
 ndc.set(px/rc.width*2-1,-(py/rc.height)*2+1);ray.setFromCamera(ndc,cam);
 var proxies=[];objs.forEach(function(o,s){var idx=st.slots[s];if(idx>=0&&s<st.nsl&&st.birds[idx].ready)proxies.push(o.eg.proxy);});
 var hit=ray.intersectObjects(proxies,false);
 if(hit.length){var hs=-1;objs.forEach(function(o,s){if(o.eg.proxy===hit[0].object)hs=s;});collect(hs,px,py,false);return;}
 var bl=[];objs.forEach(function(o){if(o.A)bl.push(o.A.B);});
 var hb=ray.intersectObjects(bl,true);
 if(hb.length){var ob=hb[0].object,bs=-1;while(ob){objs.forEach(function(o,s){if(o.A&&o.A.B===ob)bs=s;});if(bs>=0)break;ob=ob.parent;}
  if(bs>=0)pet(bs,px,py);}}

var drag=false,lx=0,sx0=0,sy0=0,st0=0,moved=0,t=0,dragYaw=0;
cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;sx0=e.clientX;sy0=e.clientY;st0=performance.now();moved=0;});
cv.addEventListener('pointermove',function(e){if(!drag)return;dragYaw+=(e.clientX-lx)*0.01;lx=e.clientX;moved=Math.max(moved,Math.hypot(e.clientX-sx0,e.clientY-sy0));});
window.addEventListener('pointerup',function(e){if(!drag)return;drag=false;if(moved<10&&performance.now()-st0<400)tap(e.clientX,e.clientY);});

/* ---------- склад, рынок, заказы, кухня, обмен, коллекция ---------- */
var mtab='stock',MTABS=['stock','orders','swap','book'],MTN=['Склад','Заказы','Обмен','Коллекция'];
function cap(){return 60+40*st.barn;}
function total(){var n=0;for(var i=0;i<NB;i++)n+=st.inv[i];return n;}
function price(i){return val(i)*st.mkt.m[BD[i].type]*incomeMul();}
function stockValue(){var c=0;for(var i=0;i<NB;i++)c+=price(i)*st.inv[i];return c;}
function sellBird(i,n){n=Math.min(n,st.inv[i]);if(n<=0)return 0;var c=Math.round(price(i)*n),k=BD[i].type;st.inv[i]-=n;st.coins+=c;st.mkt.m[k]=Math.max(0.5,st.mkt.m[k]-0.004*n);return c;}
function sellAll(fx){var tot=0;for(var i=0;i<NB;i++)tot+=sellBird(i,st.inv[i]);
 if(tot>0){play('coin');st.tut.sold=true;if(fx){say('💰 Продано на 🪙'+fmt(tot),1800);burst(0,0,3,40,0xF2A33A,cellW*1.4,cellW*0.5);}pulse(document.getElementById('coins'));hud();save();}
 else if(fx)say('Склад пуст: сначала собери яйца',1400);return tot;}
function tierCount(k){var c=0;for(var i=0;i<NB;i++)if(BD[i].type===k)c+=st.inv[i];return c;}
function takeTier(k,n){for(var i=0;i<NB&&n>0;i++)if(BD[i].type===k){var d=Math.min(n,st.inv[i]);st.inv[i]-=d;n-=d;}}
function barnCost(){return Math.round(400*Math.pow(1.7,st.barn));}
function mktTick(){for(var k=0;k<4;k++){var m=st.mkt.m[k],nm=m+(1-m)*0.1+R(-0.09,0.09);nm=Math.max(0.6,Math.min(1.6,nm));st.mkt.d[k]=nm>m+0.005?1:nm<m-0.005?-1:0;st.mkt.m[k]=nm;}hud();}
function genOrder(){var pool=[],i;for(i=0;i<NB;i++)if(st.own[i])pool.push(i);i=pool[Math.floor(Math.random()*pool.length)];
 var tp=BD[i].type,q=tp===0?Math.round(R(8,20)):tp===1?Math.round(R(5,12)):Math.round(R(3,8));
 return {bird:i,qty:q,c:Math.round(q*BD[i].val*R(1.6,2.2)*(1+0.05*st.upg[i])),g:(tp>=1&&Math.random()<0.4)?1:0};}
function ensureOrders(){while(st.orders.length<3)st.orders.push(genOrder());}
var EXR=[200,60,20,6],MS=[25,250,2500],MR=[1,3,10];
function gemBuyCost(){return Math.round(1000*Math.pow(Math.max(1,st.level),1.4));}
function gemSellGet(){return Math.round(0.3*gemBuyCost());}
function updSell(){var b=document.getElementById('sell');if(!b)return;var show=panelName==='farm'&&total()>0;b.style.display=show?'block':'none';if(show)b.textContent='💰 Продать (🪙'+fmt(stockValue())+')';}
document.getElementById('sell').addEventListener('click',function(){sellAll(true);});
function marketAct(a,i){
 if(a==='mtab'){mtab=MTABS[i];return true;}
 if(a==='sell1'){sellBird(i,1);return true;}
 if(a==='sellb'){sellBird(i,st.inv[i]);return true;}
 if(a==='sellall'){sellAll(false);return true;}
 if(a==='barn'){var c=barnCost();if(st.coins>=c){st.coins-=c;st.barn++;say('📦 Амбар расширен: '+cap()+' яиц',1800);}return true;}
 if(a==='order'){var od=st.orders[i];if(st.inv[od.bird]>=od.qty){st.inv[od.bird]-=od.qty;st.coins+=od.c;st.gems+=od.g;addXp(od.qty*TYPES[BD[od.bird].type].xp*2);st.orders[i]=genOrder();say('Заказ выполнен: 🪙'+fmt(od.c)+(od.g?' 💎'+od.g:''),2000);}return true;}
 if(a==='reroll'){st.orders[i]=genOrder();return true;}
 if(a==='exg'){if(tierCount(i)>=EXR[i]){takeTier(i,EXR[i]);st.gems+=1;say('💎 +1',1200);}return true;}
 if(a==='buygem'){var c2=gemBuyCost();if(st.coins>=c2){st.coins-=c2;st.gems+=1;}return true;}
 if(a==='sellgem'){if(st.gems>=1){st.gems-=1;st.coins+=gemSellGet();}return true;}
 if(a==='book'){var cl=st.cntCl[i];if(cl<3&&st.cnt[i]>=MS[cl]){st.gems+=MR[cl];st.cntCl[i]++;say('Награда за коллекцию: 💎'+MR[cl],1800);}return true;}
 return false;}
function panelMarket(){
 var h='<h2>Рынок</h2><div class="chips">';
 MTABS.forEach(function(k,i){h+='<button class="chip'+(mtab===k?' on':'')+'" data-act="mtab" data-i="'+i+'">'+MTN[i]+'</button>';});
 h+='</div>';var i;
 if(mtab==='stock'){
  var tot=total(),bc=barnCost();
  h+=card('📦','Амбар '+tot+' / '+cap(),'Когда амбар полон, новые яйца собрать нельзя. Продавай яйца или расширяй амбар'+pbar(tot,cap()),btn('+40 за 🪙'+fmt(bc),'barn',0,st.coins>=bc));
  h+=card('💰','Продать всё','Стоимость склада сейчас: 🪙'+fmt(stockValue()),btn('Продать','sellall',0,tot>0));
  h+='<h3>Цены рынка</h3>';
  for(i=0;i<4;i++){var m=st.mkt.m[i],dd=st.mkt.d[i];h+=card(['🥚','🥇','🌈','💎'][i],TYPES[i].name+' яйца','Спрос: ×'+m.toFixed(2)+' '+(dd>0?'<span class="up">▲ растёт</span>':dd<0?'<span class="dn">▼ падает</span>':'держится')+'. Продажа большого числа яиц снижает цену, она потом восстанавливается','');}
  h+='<h3>Мои яйца</h3>';var any=false;
  for(i=0;i<NB;i++){if(st.inv[i]<=0)continue;any=true;h+=card(BD[i].ico,'Яйцо: '+BN[i],'В запасе: '+st.inv[i]+' · цена 🪙'+fmt(price(i))+' за штуку',btn('1','sell1',i,true)+btn('Все','sellb',i,true));}
  if(!any)h+='<div class="note">Склад пуст. Собирай яйца на ферме.</div>';}
 else if(mtab==='orders'){
  h+='<div class="note">Покупатели платят больше рынка. Собери нужные яйца и сдай заказ.</div>';
  st.orders.forEach(function(od,k){var have=st.inv[od.bird];h+=card(BD[od.bird].ico,'Заказ: '+BN[od.bird]+' ×'+od.qty,'Есть '+have+' / '+od.qty+' · награда 🪙'+fmt(od.c)+(od.g?' 💎'+od.g:'')+pbar(have,od.qty),btn('Сдать','order',k,have>=od.qty)+btn('↻','reroll',k,true));});}
 else if(mtab==='swap'){
  h+='<div class="note">Яйца и монеты можно менять на 💎.</div><h3>Яйца в 💎</h3>';
  for(i=0;i<4;i++){var hv=tierCount(i);h+=card(['🥚','🥇','🌈','💎'][i],TYPES[i].name+' яйца → 💎1','Нужно '+EXR[i]+' яиц, есть '+hv,btn('Обменять','exg',i,hv>=EXR[i],'alt'));}
  h+='<h3>Монеты и 💎</h3>';
  h+=card('🪙','Купить 💎1','Цена растёт с уровнем',btn('🪙'+fmt(gemBuyCost()),'buygem',0,st.coins>=gemBuyCost(),'alt'));
  h+=card('💎','Продать 💎1','Курс хуже, чем покупка',btn('🪙'+fmt(gemSellGet()),'sellgem',0,st.gems>=1));}
 else{
  h+='<div class="note">Собирай яйца каждой птицы и получай 💎 за 25, 250 и 2500 яиц.</div>';
  for(i=0;i<NB;i++){var cl=st.cntCl[i],nx=cl<3?MS[cl]:null,ok=nx!==null&&st.cnt[i]>=nx;
   h+=card(BD[i].ico,BN[i],'Собрано яиц: '+st.cnt[i]+(nx?' · цель '+nx+' (💎'+MR[cl]+')'+pbar(st.cnt[i],nx):' · все награды получены'),ok?btn('💎'+MR[cl],'book',i,true,'alt'):'',!st.own[i]);}}
 return h;}

function cheapestUp(){var m=Infinity,i;for(i=0;i<NB;i++)if(st.own[i]&&st.upg[i]<MAXUP)m=Math.min(m,upCost(i));return m;}
function goalInfo(){
 var i,L=st.level;
 if(st.eggs===0)return {t:'Коснись светящегося яйца над птицей, чтобы забрать его',go:'farm'};

 for(i=0;i<NB;i++)if(!st.own[i]&&st.level>=BD[i].lvl&&st.coins>=BD[i].price)return {t:'Можно купить птицу: '+BN[i]+' (раздел «Птицы»)',go:'birds'};
 if(st.nsl<6&&L>=SL[st.nsl].lvl&&st.coins>=SL[st.nsl].price)return {t:'Открой новый слот: нажми табличку закрытого слота',go:'farm'};
 if(total()>=cap()*0.9)return {t:'Склад почти полон: продай яйца',go:'farm'};
 if(st.coins>=cheapestUp())return {t:'Хватает монет на улучшение птицы: открой «Птицы»',go:'birds'};
 return {t:'До уровня '+(L+1)+' осталось '+fmt(Math.max(0,need()-st.xp))+' опыта',go:''};}

 else if(a==='buy'){var d=BD[i];if(st.coins<d.price||st.level<d.lvl||st.own[i])return;st.coins-=d.price;st.own[i]=true;st.birds[i].prog=0;st.birds[i].ready=false;

 else if(a==='slot'){var d2=SL[i];if(i!==st.nsl||st.level<d2.lvl||st.coins<d2.price)return;st.coins-=d2.price;st.nsl=i+1;say('Слот '+(i+1)+' открыт!',1800);}
 else if(a==='put'){putBird(pickSlot,i);say(BN[i]+' теперь на ферме',1500);openPanel('farm');save();hud();return;}
 else if(a==='clear'){putBird(pickSlot,-1);openPanel('farm');save();hud();return;}
 else if(a==='feed'){var f=FEED[i],p=Math.round(f.price*(1+Math.max(1,st.level)*0.3));if(st.coins<p)return;st.coins-=p;
  st.birds.forEach(function(b,k){if(st.own[k]){b.mood=Math.min(1,b.mood+f.mood);if(f.grow&&!b.ready)b.prog=Math.min(0.999,b.prog+f.grow);}});

 else if(a==='cspd'){var ps=150*Math.max(1,st.level);if(st.coins<ps)return;st.coins-=ps;st.spd=Math.max(Date.now(),st.spd)+300000;say('🧪 Яйца растут ×2 быстрее 5 минут',1800);}

 else if(a==='acc'){var ac=ACC[i],ok=ac.cur==='g'?st.gems>=ac.price:st.coins>=ac.price;if(!ok||st.accOwn[ac.id])return;if(ac.cur==='g')st.gems-=ac.price;else st.coins-=ac.price;st.accOwn[ac.id]=true;st.acc=ac.id;applyAcc();say(ac.ico+' '+ac.name+' надет на всех птиц',2000);}

function stepEv(o,name,dt){var ev=o[name];if(!ev)return 0;ev.t+=dt;var u=Math.min(1,ev.t/ev.dur);if(ev.t>=ev.dur)o[name]=null;return u;}
function animBird(o,s,dt,b){
 var A=o.A;if(!A)return;
 var tm=t+s*1.7,em=o.emo,u=0,id='',sn=0;
 if(em){em.t+=dt;u=Math.min(1,em.t/em.dur);id=em.id;sn=Math.sin(Math.PI*u);if(em.t>=em.dur)o.emo=null;}
 var bs=1+0.02*Math.sin(tm*2.2),hy=Math.sin(tm*0.6)*0.4,hz=Math.sin(tm*0.9)*0.06,wa=0.04+Math.sin(tm*2.2)*0.012,ty=Math.sin(tm*1.1)*0.07,tz=0,hop=0,spin=0,closed=false;
 if(A.hover)wa=0.55+Math.sin(t*45)*0.45;
 if(em){
  if(id==='love'){hz+=0.3*sn;hy=0.2*sn;}
  else if(id==='joy'){hop=Math.abs(Math.sin(u*Math.PI*3));wa+=0.45*sn;}
  else if(id==='curious'){hy=Math.sin(u*Math.PI*4)*0.7;hz+=0.28*sn;}
  else if(id==='surprise'){wa+=0.9*sn;bs+=0.1*sn;hop=0.4*sn;}
  else if(id==='sleepy'){closed=true;hz-=0.45*Math.min(1,u*4)*(1-Math.max(0,(u-0.85)/0.15));}
  else if(id==='playful'){spin=u*Math.PI*2;hop=0.3*sn;ty+=Math.sin(u*40)*0.25;}
  else if(id==='proud'){bs+=0.12*sn;hz+=0.3*sn;}
  else if(id==='laugh'){tz=Math.sin(u*70)*0.07*(1-u);hop=Math.abs(Math.sin(u*20))*0.2;}
  else if(id==='inlove'){hz+=0.4*sn;hy=Math.sin(u*Math.PI*2)*0.3;wa+=0.2*sn;}
  else if(id==='ecstatic'){wa+=0.5+0.5*Math.sin(t*30);hop=Math.abs(Math.sin(u*Math.PI*5))*0.8;spin=u*Math.PI*2;}
  else if(id==='dance'){spin=Math.sin(u*Math.PI*2)*0.8;hop=Math.abs(Math.sin(u*Math.PI*6))*0.4;ty+=Math.sin(u*50)*0.3;wa+=0.3*sn;}
  else if(id==='sing'){hz+=0.35*sn;bs+=0.03*Math.sin(u*30);hy=Math.sin(u*Math.PI*3)*0.2;}
  else if(id==='shy'){hy=-0.9*sn;hz-=0.5*sn;}
  else if(id==='sneaky'){hz+=0.2*sn;hy=0.5*Math.sin(u*Math.PI*2);closed=(u>0.3&&u<0.5);}
  else if(id==='grateful'){hz-=0.6*Math.abs(Math.sin(u*Math.PI*2));}}
 if(!b.ready&&b.prog>0.85){var an=(b.prog-0.85)/0.15;hz+=0.28*an;hop+=0.12*an*Math.abs(Math.sin(t*9));hy+=Math.sin(t*5)*0.15*an;}
 var lu=stepEv(o,'lay',dt);if(lu>0||o.lay){var ls=Math.sin(Math.PI*lu);bs-=0.07*ls;wa+=0.6*ls;hz+=0.35*ls;}
 var cu=stepEv(o,'cheer',dt);if(cu>0||o.cheer){var cs=Math.sin(Math.PI*cu);hop+=Math.abs(Math.sin(cu*Math.PI*3))*0.9;wa+=0.8*cs;hy+=Math.sin(cu*18)*0.35*(1-cu);}
 o.bt+=dt;if(o.bt>3.2+s*0.4){o.bt=0;o.blink=0.14;}if(o.blink>0)o.blink-=dt;
 var cl=closed||o.blink>0;
 A.eyes.forEach(function(e){e.scale.y=cl?0.1:1;});
 A.body.scale.set(bs,bs,bs);A.hg.rotation.y=hy;A.hg.rotation.z=hz;A.tail.rotation.y=ty;A.tg.rotation.x=tz;
 A.wings.forEach(function(w){w.g.rotation.y=w.sd*wa;});
 A.B.rotation.y=-0.5+dragYaw+Math.sin(t*0.4+s)*0.35+spin;
 A.B.position.y=o.by+(A.hover?Math.sin(t*3+s)*cellW*0.015:0)+hop*cellW*0.07;}
function backOut(x){var c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function animEgg(o,b,idx,s,dt){
 var e=o.eg,Rr=e.R,ready=b.ready,prog=b.prog,k=ready?1:0.22+0.78*prog,Ty=TYPES[BD[idx].type];
 if(!ready&&prog<0.08)k*=Math.max(0.05,backOut(prog/0.08));
 k*=1+0.02*Math.sin(t*3+s);if(ready)k*=1+0.06*Math.sin(t*7+s);
 e.egg.scale.set(Rr*k,Rr*k*1.3,Rr*k);
 e.spin+=dt*(ready?2.6:0.4+prog*2.2);e.egg.rotation.y=e.spin;
 e.egg.rotation.z=(!ready&&prog>0.75)?Math.sin(t*24)*0.14*((prog-0.75)/0.25):(ready?Math.sin(t*4+s)*0.07:0);
 e.egg.position.y=Rr*(0.05+1.3*k)+(ready?Math.abs(Math.sin(t*3.2+s))*Rr*0.45:0);
 e.halo.position.y=e.egg.position.y;e.halo.scale.setScalar(Rr*(3.5+2*k));
 e.halo.material.opacity=ready?0.55+0.2*Math.sin(t*5+s):0.05+0.35*prog*prog;
 var hx=Ty.hex;
 if(BD[idx].type===2){var rc=new T.Color().setHSL((t*0.6)%1,0.55,0.8);e.egg.material.color.copy(rc);e.halo.material.color.setHSL((t*0.6)%1,0.9,0.6);hx=e.halo.material.color.getHex();}
 else{e.egg.material.color.setHex(Ty.tint);e.halo.material.color.setHex(Ty.glow);}
 e.egg.material.emissive.setHex(ready?(BD[idx].type===1?0x3a2a00:BD[idx].type===3?0x0a3a40:0x1a1200):0x000000);
 var p=eggPos(o);
 if(!ready&&prog>0.4&&Math.random()<dt*6*prog)spark(p.x+R(-1,1)*Rr,p.y+Rr*R(-1,1),p.z,R(-0.3,0.3)*Rr,Rr*R(0.4,1.2),0,0xffe8a0,R(0.5,0.9));
 if(ready&&Math.random()<dt*20){var a=t*3+R(0,6.28);spark(p.x+Math.cos(a)*Rr*1.7,p.y+Math.sin(a)*Rr*1.2,p.z,-Math.sin(a)*Rr*0.7,Math.cos(a)*Rr*0.7,0,hx,R(0.5,0.9));}
 if(ready&&!o.wasReady){burst(p.x,p.y,p.z,16,Ty.hex,cellW*0.8,cellW*0.3);o.lay={t:0,dur:0.9};play('ready');}
 o.wasReady=ready;}
function animDecor(dt){
 if(st.decor.flies)decFly.forEach(function(f){f.s.position.set(Math.sin(t*f.sx+f.a)*hw*0.9,Math.sin(t*f.sy+f.b)*hh*0.85,1.5);f.s.material.opacity=0.5+0.5*Math.sin(t*3+f.a);});
 if(st.decor.garland)decBulb.forEach(function(g,i){g.material.opacity=0.45+0.4*Math.sin(t*4+i);});
 if(st.decor.waterfall&&fallTex)fallTex.offset.y-=dt*0.7;}

/* ---------- помощники: прыгают и забирают яйца ---------- */
var helperT={monkey:0,frog:0,sloth:0,snake:0};
var HOFF={monkey:{dx:0,dy:-2.6},frog:{dx:0,dy:-2.2},sloth:{dx:0,dy:-1.2},snake:{dx:-6,dy:-1.2}};
function helperRun(h,dt){
 if(!helperOn(h.id)||total()>=cap())return;
 helperT[h.id]+=dt;if(helperT[h.id]<h.every||jungle.busy(h.id))return;
 var cand=[];
 objs.forEach(function(o,s){var idx=st.slots[s];if(idx<0||s>=st.nsl)return;var b=st.birds[idx];if(b.ready&&!b.reserved)cand.push(s);});
 if(!cand.length)return;
 var s;
 if(h.id==='sloth'){s=cand[0];cand.forEach(function(c){if(val(st.slots[c])>val(st.slots[s]))s=c;});}
 else s=cand[Math.floor(Math.random()*cand.length)];
 var idx=st.slots[s],b=st.birds[idx],ep=eggPos(objs[s]),off=HOFF[h.id];
 b.reserved=true;helperT[h.id]=0;play('boing');
 jungle.send(h.id,{x:ep.x+off.dx,y:ep.y+off.dy,z:EGGZ+2},function(){
  b.reserved=false;
  if(b.ready&&st.slots[s]===idx&&s<st.nsl){var sp=toScreen(eggPos(objs[s]));collect(s,sp.x,sp.y,true,h.mul,h.ico+' ');}});}

/* ---------- главный цикл ---------- */
var last=performance.now(),saveT=0,mktT=0;
hud();
function loop(){
 var now=performance.now(),dt=Math.min((now-last)/1000,0.1);last=now;t+=dt;
 var visible=panelName==='farm',spdm=Date.now()<st.spd?2:1;
 for(var i=0;i<NB;i++)st.birds[i].mood=Math.max(0,st.birds[i].mood-dt/80);
 objs.forEach(function(o,s){
  var idx=st.slots[s];
  if(idx<0||s>=st.nsl)return;
  var b=st.birds[idx];
  if(!b.ready){b.prog+=dt/(period(idx)/(1+0.6*b.mood)/spdm);if(b.prog>=1){b.prog=1;b.ready=true;}}
  if(visible){animBird(o,s,dt,b);animEgg(o,b,idx,s,dt);}
  bars[s].style.width=(b.mood*100)+'%';});
 mktT+=dt;if(mktT>30){mktT=0;mktTick();}
 if(visible)HELPERS.forEach(function(h){helperRun(h,dt);});
 if(visible){updParticles(dt);jungle.update(t);animDecor(dt);renderer.render(scene,cam);}
 saveT+=dt;if(saveT>5){saveT=0;save();}
 requestAnimationFrame(loop);}
loop();
})();
</script>
