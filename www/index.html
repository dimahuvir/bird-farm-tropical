<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Птичья ферма</title>
<style>
:root{--night:#0A2620;--canopy:#17413A;--moss:#2E6B4F;--egg:#F6E7C1;--amber:#F2A33A;--berry:#C2437B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--night);color:var(--egg);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hud{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--canopy)}
#level{min-width:92px}
#level b{display:block;font-size:15px;color:var(--amber)}
#level small{font-size:11px;opacity:.85}
#xp{height:6px;border-radius:3px;background:var(--night);margin-top:3px;overflow:hidden}
#xpfill{height:100%;width:0%;background:var(--amber)}
.stat{flex:1;text-align:center;font-size:17px;font-weight:700;background:var(--night);border-radius:14px;padding:8px 4px}
.pulse{animation:pulse .35s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22);box-shadow:0 0 14px var(--amber)}100%{transform:scale(1)}}
#stage{position:relative;flex:1;min-height:0;background:var(--night)}
#stage canvas{display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,24,12,.5) 100%)}
#names{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));pointer-events:none}
#names>div{align-self:end;text-align:center;padding:0 3px 6px}
.pill{pointer-events:auto;width:96%;font-family:inherit;color:var(--egg);font-size:11.5px;font-weight:700;line-height:1.15;padding:6px 6px 7px;border-radius:13px;border:2px solid var(--amber);
  background:linear-gradient(#1f5242,#0f3027);box-shadow:0 3px 0 #06201a,0 5px 10px rgba(0,0,0,.5)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #06201a}
.pill span{display:block}
.bar{display:block;width:80%;height:6px;margin:5px auto 0;border-radius:3px;background:#06201a;overflow:hidden}
.bar b{display:block;height:100%;width:0%;background:linear-gradient(90deg,#C2437B,#F27BA5)}
.fl{position:absolute;z-index:4;pointer-events:none;font-weight:800;font-size:18px;white-space:nowrap;transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.7)}
@keyframes fl{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
#nav{display:flex;gap:8px;padding:10px 12px;background:var(--canopy)}
#nav button{flex:1;padding:12px 4px;font-size:15px;font-weight:700;font-family:inherit;border:0;border-radius:14px;background:var(--moss);color:var(--egg)}
#nav button.on{background:var(--amber);color:var(--night)}
#nav button:active{transform:scale(.97)}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);max-width:92%;text-align:center;background:var(--berry);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="level"><b id="lvl">Уровень 1</b><small id="emo"></small><div id="xp"><div id="xpfill"></div></div></div>
    <div class="stat" id="eggs">🥚 0</div>
    <div class="stat" id="coins">🪙 0</div>
  </div>
  <div id="stage"><div id="vig"></div><div id="names"></div></div>
  <div id="nav">
    <button class="on" data-t="farm">Ферма</button>
    <button data-t="shop">Магазин</button>
    <button data-t="up">Улучшить</button>
  </div>
</div>
<div id="toast"></div>
<script src="lib/three.min.js"></script>
<script src="birds.js"></script>
<script src="jungle.js"></script>
<script>
(function(){
var T=THREE;
/* ---------- меню ---------- */
var toast=document.getElementById('toast'),tm;
function say(t,ms){toast.textContent=t;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},ms||1600);}
document.querySelectorAll('#nav button').forEach(function(b){b.addEventListener('click',function(){if(b.dataset.t!=='farm')say('Этот раздел появится на следующем шаге');});});
function R(a,b){return a+Math.random()*(b-a);}

/* ---------- сцена ---------- */
var stage=document.getElementById('stage'),W=stage.clientWidth,H=stage.clientHeight;
var scene=new T.Scene();scene.background=new T.Color(0x3f8f50);
var fov=35,tanH=Math.tan(fov/2*Math.PI/180),aspect=W/H,dist=20/(tanH*aspect);
scene.fog=new T.Fog(0x5aa56a,dist*1.1,dist*2.6);
var cam=new T.PerspectiveCamera(fov,aspect,0.1,500);cam.position.set(0,0,dist);cam.lookAt(0,0,0);
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W,H);
stage.insertBefore(renderer.domElement,stage.firstChild);
scene.add(new T.HemisphereLight(0xdff5dc,0x2a4a30,0.9));
var key=new T.DirectionalLight(0xfff0cc,1.15);key.position.set(8,12,12);scene.add(key);
var rim=new T.DirectionalLight(0x88e0ff,0.4);rim.position.set(-8,4,-6);scene.add(rim);
var visH=2*dist*tanH,visW=visH*aspect,cellW=visW/3,cellH=visH/2,hw=visW/2,hh=visH/2;
var jungle=buildJungle(scene,visW,visH);

/* бамбуковые перегородки между птицами */
function bamboo(x,y,len,vert){
 var g=new T.Group(),mat=new T.MeshStandardMaterial({color:0xe0c06a,roughness:0.55}),nm=new T.MeshStandardMaterial({color:0x8a6a2a,roughness:0.6}),s,ring;
 g.add(new T.Mesh(new T.CylinderGeometry(0.34,0.34,len,12),mat));
 for(s=-len/2+2.2;s<len/2;s+=2.6){ring=new T.Mesh(new T.TorusGeometry(0.37,0.08,6,14),nm);ring.rotation.x=Math.PI/2;ring.position.y=s;g.add(ring);}
 g.position.set(x,y,-1);if(!vert)g.rotation.z=Math.PI/2;scene.add(g);}
bamboo(-cellW/2,0,visH,true);bamboo(cellW/2,0,visH,true);bamboo(0,0,visW,false);
[-cellW/2,cellW/2].forEach(function(x){var kn=new T.Mesh(new T.TorusGeometry(0.55,0.12,8,16),new T.MeshStandardMaterial({color:0x4a3a1c,roughness:0.8}));kn.position.set(x,0,-0.6);scene.add(kn);
 jungle.cluster(x,0,-0.4,Math.PI/2+0.3,2,cellW*0.22,0.9);});

/* ---------- частицы: искры, монеты ---------- */
var glowT=(function(){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.4,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new T.CanvasTexture(c);})();
var PN=260,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pNext=0,pGeo=new T.BufferGeometry(),pk;
for(pk=0;pk<PN;pk++)pPos[pk*3+2]=-999;
pGeo.setAttribute('position',new T.BufferAttribute(pPos,3));pGeo.setAttribute('color',new T.BufferAttribute(pCol,3));
var pts=new T.Points(pGeo,new T.PointsMaterial({size:visH*0.045,map:glowT,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));pts.frustumCulled=false;scene.add(pts);
var tmpC=new T.Color();
function spark(x,y,z,vx,vy,vz,hex,life){var k=pNext++%PN;tmpC.setHex(hex);pPos[k*3]=x;pPos[k*3+1]=y;pPos[k*3+2]=z;pVel[k*3]=vx;pVel[k*3+1]=vy;pVel[k*3+2]=vz;pCol[k*3]=tmpC.r;pCol[k*3+1]=tmpC.g;pCol[k*3+2]=tmpC.b;pLife[k]=life;}
function burst(x,y,z,n,hex,spd,up){for(var k=0;k<n;k++){var a=R(0,6.28),s=spd*R(0.4,1);spark(x,y,z,Math.cos(a)*s,Math.sin(a)*s+(up||0),R(-0.5,0.5),hex,R(0.6,1.1));}}
function updParticles(dt){
 for(var k=0;k<PN;k++){if(pLife[k]<=0)continue;pLife[k]-=dt;
  if(pLife[k]<=0){pPos[k*3+2]=-999;continue;}
  pPos[k*3]+=pVel[k*3]*dt;pPos[k*3+1]+=pVel[k*3+1]*dt;pPos[k*3+2]+=pVel[k*3+2]*dt;pVel[k*3+1]-=cellW*0.8*dt;
  var f=Math.min(1,pLife[k]*2.2);pCol[k*3]*=1-dt*0.8*(1-f);pCol[k*3+1]*=1-dt*0.8*(1-f);pCol[k*3+2]*=1-dt*0.8*(1-f);}
 pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;}

/* ---------- эмоции птиц (одна новая за уровень) ---------- */
var E=[
{id:'love',icon:'💖',name:'Любовь'},{id:'joy',icon:'😄',name:'Радость'},{id:'curious',icon:'🤔',name:'Любопытство'},
{id:'surprise',icon:'😮',name:'Удивление'},{id:'sleepy',icon:'😴',name:'Сонливость'},{id:'playful',icon:'🤩',name:'Игривость'},
{id:'proud',icon:'😎',name:'Гордость'},{id:'laugh',icon:'😂',name:'Смех'},{id:'inlove',icon:'🥰',name:'Влюблённость'},{id:'ecstatic',icon:'🎉',name:'Восторг'}];

/* ---------- яйца: гнездо, рост, вращение, свечение ---------- */
var eggTex=(function(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d'),i;g.fillStyle='#fff7e6';g.fillRect(0,0,128,128);
 for(i=0;i<90;i++){g.fillStyle='rgba(120,80,40,'+(0.15+Math.random()*0.35)+')';g.beginPath();g.arc(Math.random()*128,Math.random()*128,1+Math.random()*3,0,7);g.fill();}return new T.CanvasTexture(c);})();
var eggGeo=new T.SphereGeometry(1,28,20),nestGeo=new T.TorusGeometry(1.3,0.3,8,22);
function makeEgg(Rr){
 var root=new T.Group(),nest=new T.Mesh(nestGeo,new T.MeshStandardMaterial({color:0x6b4a2b,roughness:0.9}));nest.rotation.x=Math.PI/2;nest.scale.set(Rr,Rr,Rr*0.7);root.add(nest);
 var pad=new T.Mesh(new T.CylinderGeometry(1.4,1.2,0.25,16),new T.MeshStandardMaterial({color:0x3f8f45,roughness:0.7}));pad.scale.set(Rr,Rr,Rr);pad.position.y=-Rr*0.12;root.add(pad);
 var halo=new T.Sprite(new T.SpriteMaterial({map:glowT,transparent:true,opacity:0,blending:T.AdditiveBlending,depthWrite:false,color:0xffe8a0}));root.add(halo);
 var egg=new T.Mesh(eggGeo,new T.MeshStandardMaterial({map:eggTex,color:0xffffff,roughness:0.25,metalness:0.08}));root.add(egg);
 var proxy=new T.Mesh(new T.SphereGeometry(1,8,6),new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));proxy.scale.setScalar(Rr*1.9);proxy.position.y=Rr*0.9;root.add(proxy);
 return {root:root,egg:egg,halo:halo,proxy:proxy,R:Rr,spin:0};}

/* ---------- птицы и яйца на сцене ---------- */
var names=document.getElementById('names'),objs=[];
var RAR=['#4aa3ff','#b06cff','#4aa3ff','#7bd88f','#7bd88f','#F2A33A'];
BIRD_NAMES.forEach(function(n,i){names.insertAdjacentHTML('beforeend','<div><button class="pill" data-i="'+i+'" style="border-color:'+RAR[i]+'"><span>'+n+'</span><i class="bar"><b></b></i></button></div>');});
var bars=[].slice.call(document.querySelectorAll('#names .bar b'));
for(var bi2=0;bi2<6;bi2++){(function(i){
 var A=makeBird(i),col=i%3,row=Math.floor(i/3),cx=(col-1)*cellW,cy=(row===0?1:-1)*visH/4;
 var sc=Math.min(cellW*0.86,cellH*0.42)/A.ext;
 A.B.scale.setScalar(sc);
 var by=cy-A.cy*sc-cellH*0.08;
 A.B.position.set(cx-A.cx*sc,by,0);scene.add(A.B);
 var eg=makeEgg(cellW*0.11);eg.root.position.set(cx,cy+cellH*0.28,2);scene.add(eg.root);
 objs.push({A:A,eg:eg,by:by,bt:0,blink:0,emo:null,lay:null,cheer:null,wasReady:false});})(bi2);}

/* ---------- состояние ---------- */
var SAVE_KEY='birdfarm_v2',PERIOD=[12,14,16,8,18,22],VALUE=[2,3,4,1,5,7];
var TYPES=[{name:'Яйцо',mult:1,xp:1,tint:0xffffff,glow:0xffe8a0,hex:0xffe8a0},{name:'Золотое',mult:5,xp:3,tint:0xffd45a,glow:0xffcc33,hex:0xffcc33},{name:'Радужное',mult:15,xp:8,tint:0xffffff,glow:0xff66cc,hex:0xff66cc},{name:'Кристальное',mult:50,xp:20,tint:0xa8f0ff,glow:0x7FE5E5,hex:0x7FE5E5}];
function rollType(){var x=Math.random();return x<0.01?3:x<0.06?2:x<0.21?1:0;}
var st={eggs:0,coins:0,xp:0,level:1,birds:[]},fresh=true,q;
for(q=0;q<6;q++)st.birds.push({prog:0,ready:false,type:0,mood:0});
var savedAt=Date.now();
try{var raw=localStorage.getItem(SAVE_KEY);if(raw){var o=JSON.parse(raw);if(o&&o.birds&&o.birds.length===6){st=o;savedAt=o.savedAt||Date.now();fresh=false;}}}catch(e){}
function need(){return 10+st.level*8;}
function addXp(n){st.xp+=n;while(st.xp>=need()){st.xp-=need();st.level++;
 var ne=E[st.level-1];say('Уровень '+st.level+'!'+(ne?'  Новая эмоция птиц: '+ne.icon+' '+ne.name:''),3200);}}
function pulse(el){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
function hud(){
 document.getElementById('lvl').textContent='Уровень '+st.level;
 document.getElementById('emo').textContent='Эмоции '+Math.min(st.level,E.length)+'/'+E.length;
 document.getElementById('xpfill').style.width=Math.min(100,st.xp/need()*100)+'%';
 document.getElementById('eggs').textContent='🥚 '+st.eggs;document.getElementById('coins').textContent='🪙 '+st.coins;}
var away=Math.min((Date.now()-savedAt)/1000,8*3600),offE=0,offC=0;
if(!fresh&&away>60){st.birds.forEach(function(b,i){var n=Math.floor(away*0.6/PERIOD[i]);if(n>0){offE+=n;offC+=n*VALUE[i];}});
 st.eggs+=offE;st.coins+=offC;if(offE>0)setTimeout(function(){say('Пока тебя не было: +'+offE+' яиц, +'+offC+' монет',3500);},700);}
if(fresh)setTimeout(function(){say('Касайся птиц: они отзовутся эмоциями. Созревшие яйца собирай касанием',3800);},900);
names.addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;var i=+b.dataset.i;say(BIRD_NAMES[i]+': настроение '+Math.round(st.birds[i].mood*100)+'%',1800);});

/* ---------- действия ---------- */
function floatText(txt,x,y,color,size){
 var d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';
 if(color)d.style.color=color;if(size)d.style.fontSize=size+'px';stage.appendChild(d);setTimeout(function(){d.remove();},1100);}
function eggPos(o){var e=o.eg;return {x:e.root.position.x,y:e.root.position.y+e.egg.position.y,z:e.root.position.z};}
var combo=0,lastCollect=0,lastPet=0;
function collect(i,px,py){
 var b=st.birds[i],o=objs[i];if(!b.ready)return;
 var now=performance.now();combo=(now-lastCollect<1500)?Math.min(combo+1,6):1;lastCollect=now;
 var Ty=TYPES[b.type],cm=1+0.2*(combo-1),coins=Math.round(VALUE[i]*Ty.mult*cm),p=eggPos(o);
 st.eggs++;st.coins+=coins;addXp(Ty.xp);b.mood=Math.min(1,b.mood+0.05);
 burst(p.x,p.y,p.z,18+b.type*8,Ty.hex,cellW*1.2,cellW*0.4);burst(p.x,p.y,p.z,10,0xF2A33A,cellW*0.9,cellW*1.1);
 o.cheer={t:0,dur:1.2};
 floatText('+'+coins+(combo>1?'  x'+combo:''),px,py,b.type>0?'#F2A33A':'#F6E7C1',20);
 if(b.type>0)say(Ty.name+' яйцо! +'+coins,1400);
 b.ready=false;b.prog=0;b.type=0;hud();
 pulse(document.getElementById('eggs'));pulse(document.getElementById('coins'));}
function emote(i,px,py){
 var o=objs[i],n=Math.min(st.level,E.length),pool=[],k;
 for(k=0;k<n;k++)if(n===1||k!==o.lastE)pool.push(k);
 var ei=pool[Math.floor(Math.random()*pool.length)];o.lastE=ei;
 o.emo={id:E[ei].id,t:0,dur:E[ei].id==='sleepy'?2.2:1.6};
 floatText(E[ei].icon+' '+E[ei].name,px,py,'#F6E7C1',17);
 if(E[ei].id==='inlove'){floatText('💗',px-30,py+10,'#fff',22);floatText('💗',px+30,py+5,'#fff',22);}
 if(E[ei].id==='ecstatic'){floatText('✨',px-34,py,'#fff',22);floatText('✨',px+34,py-8,'#fff',22);}}
function pet(i,px,py){
 var now=performance.now();if(now-lastPet<250)return;lastPet=now;
 st.birds[i].mood=Math.min(1,st.birds[i].mood+0.1);emote(i,px,py);}
var ray=new T.Raycaster(),ndc=new T.Vector2(),cv=renderer.domElement;
function tap(cx,cy){
 var rc=cv.getBoundingClientRect(),px=cx-rc.left,py=cy-rc.top;
 ndc.set(px/rc.width*2-1,-(py/rc.height)*2+1);ray.setFromCamera(ndc,cam);
 var proxies=[];objs.forEach(function(o,i){if(st.birds[i].ready)proxies.push(o.eg.proxy);});
 var hit=ray.intersectObjects(proxies,false);
 if(hit.length){var hi=-1;objs.forEach(function(o,i){if(o.eg.proxy===hit[0].object)hi=i;});collect(hi,px,py);return;}
 var hb=ray.intersectObjects(objs.map(function(o){return o.A.B;}),true);
 if(hb.length){var ob=hb[0].object,bi3=-1;while(ob){objs.forEach(function(o,i){if(o.A.B===ob)bi3=i;});if(bi3>=0)break;ob=ob.parent;}
  if(bi3>=0)pet(bi3,px,py);}}

/* ---------- управление ---------- */
var drag=false,lx=0,sx0=0,sy0=0,st0=0,moved=0,t=0,dragYaw=0;
cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;sx0=e.clientX;sy0=e.clientY;st0=performance.now();moved=0;});
cv.addEventListener('pointermove',function(e){if(!drag)return;dragYaw+=(e.clientX-lx)*0.01;lx=e.clientX;moved=Math.max(moved,Math.hypot(e.clientX-sx0,e.clientY-sy0));});
window.addEventListener('pointerup',function(e){if(!drag)return;drag=false;if(moved<10&&performance.now()-st0<400)tap(e.clientX,e.clientY);});
function save(){try{st.savedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(st));}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);

/* ---------- анимации ---------- */
function stepEv(o,name,dt){var ev=o[name];if(!ev)return 0;ev.t+=dt;var u=Math.min(1,ev.t/ev.dur);if(ev.t>=ev.dur)o[name]=null;return u;}
function animBird(o,i,dt,b){
 var A=o.A,tm=t+i*1.7,em=o.emo,u=0,id='',s=0;
 if(em){em.t+=dt;u=Math.min(1,em.t/em.dur);id=em.id;s=Math.sin(Math.PI*u);if(em.t>=em.dur)o.emo=null;}
 var bs=1+0.02*Math.sin(tm*2.2),hy=Math.sin(tm*0.6)*0.4,hz=Math.sin(tm*0.9)*0.06,wa=0.04+Math.sin(tm*2.2)*0.012,ty=Math.sin(tm*1.1)*0.07,tz=0,hop=0,spin=0,closed=false;
 if(A.hover)wa=0.55+Math.sin(t*45)*0.45;
 if(em){
  if(id==='love'){hz+=0.3*s;hy=0.2*s;}
  else if(id==='joy'){hop=Math.abs(Math.sin(u*Math.PI*3));wa+=0.45*s;}
  else if(id==='curious'){hy=Math.sin(u*Math.PI*4)*0.7;hz+=0.28*s;}
  else if(id==='surprise'){wa+=0.9*s;bs+=0.1*s;hop=0.4*s;}
  else if(id==='sleepy'){closed=true;hz-=0.45*Math.min(1,u*4)*(1-Math.max(0,(u-0.85)/0.15));}
  else if(id==='playful'){spin=u*Math.PI*2;hop=0.3*s;ty+=Math.sin(u*40)*0.25;}
  else if(id==='proud'){bs+=0.12*s;hz+=0.3*s;}
  else if(id==='laugh'){tz=Math.sin(u*70)*0.07*(1-u);hop=Math.abs(Math.sin(u*20))*0.2;}
  else if(id==='inlove'){hz+=0.4*s;hy=Math.sin(u*Math.PI*2)*0.3;wa+=0.2*s;}
  else if(id==='ecstatic'){wa+=0.5+0.5*Math.sin(t*30);hop=Math.abs(Math.sin(u*Math.PI*5))*0.8;spin=u*Math.PI*2;}}
 /* отклик на яйцо: ожидание, снесение, радость при сборе */
 if(!b.ready&&b.prog>0.85){var an=(b.prog-0.85)/0.15;hz+=0.28*an;hop+=0.12*an*Math.abs(Math.sin(t*9));hy+=Math.sin(t*5)*0.15*an;}
 var lu=stepEv(o,'lay',dt);if(lu>0||o.lay){var ls=Math.sin(Math.PI*lu);bs-=0.07*ls;wa+=0.6*ls;hz+=0.35*ls;}
 var cu=stepEv(o,'cheer',dt);if(cu>0||o.cheer){var cs=Math.sin(Math.PI*cu);hop+=Math.abs(Math.sin(cu*Math.PI*3))*0.9;wa+=0.8*cs;hy+=Math.sin(cu*18)*0.35*(1-cu);}
 o.bt+=dt;if(o.bt>3.2+i*0.4){o.bt=0;o.blink=0.14;}if(o.blink>0)o.blink-=dt;
 var cl=closed||o.blink>0;
 A.eyes.forEach(function(e){e.scale.y=cl?0.1:1;});
 A.body.scale.set(bs,bs,bs);A.hg.rotation.y=hy;A.hg.rotation.z=hz;A.tail.rotation.y=ty;A.tg.rotation.x=tz;
 A.wings.forEach(function(w){w.g.rotation.y=w.sd*wa;});
 A.B.rotation.y=-0.5+dragYaw+Math.sin(t*0.4+i)*0.35+spin;
 A.B.position.y=o.by+(A.hover?Math.sin(t*3+i)*cellW*0.015:0)+hop*cellW*0.07;}
function backOut(x){var c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function animEgg(o,b,i,dt){
 var e=o.eg,Rr=e.R,ready=b.ready,prog=b.prog,k=ready?1:0.22+0.78*prog;
 if(!ready&&prog<0.08)k*=Math.max(0.05,backOut(prog/0.08));
 k*=1+0.02*Math.sin(t*3+i);if(ready)k*=1+0.06*Math.sin(t*7+i);
 e.egg.scale.set(Rr*k,Rr*k*1.3,Rr*k);
 e.spin+=dt*(ready?2.6:0.4+prog*2.2);e.egg.rotation.y=e.spin;
 e.egg.rotation.z=(!ready&&prog>0.75)?Math.sin(t*24)*0.14*((prog-0.75)/0.25):(ready?Math.sin(t*4+i)*0.07:0);
 e.egg.position.y=Rr*(0.05+1.3*k)+(ready?Math.abs(Math.sin(t*3.2+i))*Rr*0.45:0);
 e.halo.position.y=e.egg.position.y;e.halo.scale.setScalar(Rr*(3.5+2*k));
 e.halo.material.opacity=ready?0.55+0.2*Math.sin(t*5+i):0.05+0.35*prog*prog;
 var Ty=TYPES[ready?b.type:0];
 if(ready&&b.type===2){e.egg.material.color.setHSL((t*0.6)%1,0.55,0.8);e.halo.material.color.setHSL((t*0.6)%1,0.9,0.6);}
 else{e.egg.material.color.setHex(Ty.tint);e.halo.material.color.setHex(Ty.glow);}
 e.egg.material.emissive.setHex(ready?(b.type===1?0x3a2a00:b.type===3?0x0a3a40:0x1a1200):0x000000);
 var p=eggPos(o);
 if(!ready&&prog>0.4&&Math.random()<dt*6*prog)spark(p.x+R(-1,1)*Rr,p.y+Rr*R(-1,1),p.z,R(-0.3,0.3)*Rr,Rr*R(0.4,1.2),0,0xffe8a0,R(0.5,0.9));
 if(ready&&Math.random()<dt*20){var a=t*3+R(0,6.28),hx=b.type===2?new T.Color().setHSL(Math.random(),0.9,0.6).getHex():Ty.hex;spark(p.x+Math.cos(a)*Rr*1.7,p.y+Math.sin(a)*Rr*1.2,p.z,-Math.sin(a)*Rr*0.7,Math.cos(a)*Rr*0.7,0,hx,R(0.5,0.9));}
 if(ready&&!o.wasReady){burst(p.x,p.y,p.z,16,Ty.hex,cellW*0.8,cellW*0.3);o.lay={t:0,dur:0.9};}
 o.wasReady=ready;}

/* ---------- главный цикл ---------- */
var last=performance.now(),saveT=0;
hud();
function loop(){
 var now=performance.now(),dt=Math.min((now-last)/1000,0.1);last=now;t+=dt;
 objs.forEach(function(o,i){
  var b=st.birds[i];
  b.mood=Math.max(0,b.mood-dt/80);
  if(!b.ready){b.prog+=dt/(PERIOD[i]/(1+0.6*b.mood));if(b.prog>=1){b.prog=1;b.ready=true;b.type=rollType();}}
  animBird(o,i,dt,b);animEgg(o,b,i,dt);
  bars[i].style.width=(b.mood*100)+'%';});
 updParticles(dt);jungle.update(t);
 saveT+=dt;if(saveT>5){saveT=0;save();}
 renderer.render(scene,cam);requestAnimationFrame(loop);}
loop();
})();
