name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy three.js into the app
        run: npm run prepare-web

      - name: Create Android project
        run: npx cap add android

      - name: Lock portrait orientation
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Set version code from run number
        run: sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle

      - name: Use the same signing key on every build
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore ~/.android/debug.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add debug.keystore
            git commit -m "Add permanent debug signing key [skip ci]"
            git push
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bird-farm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
